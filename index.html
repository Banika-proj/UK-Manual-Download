<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UK Manual Downloads Tracker</title>
<!-- Everything below is a local file next to this one — no internet needed, ever. -->
<link rel="stylesheet" href="fonts.css" />
<link rel="stylesheet" href="styles.css" />
<script src="chart.umd.min.js"></script>
</head>
<body>

<aside id="rail">
  <div class="rail-brand">
    <div class="mark">🇬🇧</div>
    <h1>UK Manual<br>Downloads Tracker</h1>
    <p>PDF download tracker</p>
  </div>
  <nav class="rail-nav" id="rail-nav"></nav>
  <div class="rail-foot">
    <div class="lbl">Today's progress</div>
    <div class="num" id="foot-progress">0 / 0</div>
    <div class="rail-track"><div class="rail-bar" id="foot-bar"></div></div>
  </div>
</aside>

<button id="rail-toggle" onclick="document.getElementById('rail').classList.toggle('open')">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
</button>

<main><div id="page"></div></main>
<div id="modal-root"></div>

<script src="app.js"></script>
</body>
</html>
